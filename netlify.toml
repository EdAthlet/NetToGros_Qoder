[build]
  publish = "."
  functions = "netlify/functions"

# Netlify Forms (required once per site):
# 1. Netlify UI → Forms → "Enable form detection" (OFF by default on new sites)
# 2. Deploy again after enabling
# 3. Forms → contact → Form notifications → Email → nettogross.eire@gmail.com

# Fake Revenue practice API (Cloud mode RPN / PSR)
[[redirects]]
  from = "/api/rpn"
  to = "/.netlify/functions/revenue-rpn"
  status = 200
  force = true

[[redirects]]
  from = "/api/psr"
  to = "/.netlify/functions/revenue-psr"
  status = 200
  force = true

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/revenue-status"
  status = 200
  force = true

# Neon payroll cloud data (workspace snapshot push/pull)
[[redirects]]
  from = "/api/data/health"
  to = "/.netlify/functions/data-health"
  status = 200
  force = true

[[redirects]]
  from = "/api/data/workspace"
  to = "/.netlify/functions/data-workspace"
  status = 200
  force = true

[[redirects]]
  from = "/api/data/snapshot"
  to = "/.netlify/functions/data-snapshot"
  status = 200
  force = true

# Hide internal / leaked paths from the public origin
[[redirects]]
  from = "/coverage"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/coverage/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/samples"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/samples/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/agent-tools"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/agent-tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/Pensions"
  to = "/pensions/"
  status = 301

[[redirects]]
  from = "/Pensions/*"
  to = "/pensions/:splat"
  status = 301

[[headers]]
  for = "/coverage/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/samples/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/tools/fake-revenue/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Pretty contact URLs (preserve query string, e.g. ?from=payroll)
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
  force = false

[[redirects]]
  from = "/contact/"
  to = "/contact.html"
  status = 200
  force = false

# Keep service worker fresh (avoid caching issues)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/payroll/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/css/site-nav.css"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Tax credit calculator assets — short cache so soft refresh gets layout updates
[[headers]]
  for = "/tax-credits/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"
